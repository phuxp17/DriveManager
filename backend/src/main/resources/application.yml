spring:
  application:
    name: storage-hub-backend
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/storage_hub}
    username: ${POSTGRES_USER:storage_hub}
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ${SESSION_COOKIE_NAME:SESSION}
        domain: ${SESSION_COOKIE_DOMAIN:}
        path: ${SESSION_COOKIE_PATH:/}
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

storage:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

resend:
  enabled: ${RESEND_ENABLED:true}
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:DriveManager <onboarding@resend.dev>}
  verification-url: ${APP_BASE_URL:http://localhost:8080}/api/v1/auth/verify
